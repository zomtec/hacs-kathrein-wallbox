set_ems_control_enabled:
  name: Set EMS control state
  description: Enable or disable EMS control for this Wallbox.
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: kathrein_wallbox
    enabled:
      required: true
      selector:
        boolean: {}

set_relay_matrix:
  name: Set relay matrix
  description: Write the valid relay-matrix setpoint for EMS control.
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: kathrein_wallbox
    value:
      required: true
      selector:
        select:
          translation_key: ems_relay_matrix
          mode: dropdown
          options:
            - line_1
            - line_2
            - line_3
            - three_lines

set_charging_current:
  name: Set EMS charging current setpoint
  description: Write one of the valid EMS charging current setpoints.
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: kathrein_wallbox
    value:
      required: true
      selector:
        select:
          translation_key: ems_charging_current
          options:
            - "6"
            - "8"
            - "10"
            - "12"
            - "16"
            - "20"
            - "24"
            - "32"

set_timeout_period:
  name: Set timeout period
  description: Write one of the valid timeout periods for the EMS override.
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: kathrein_wallbox
    value:
      required: true
      selector:
        select:
          translation_key: ems_timeout_period
          options:
            - "0"
            - "30"
            - "60"
            - "120"
            - "180"
            - "300"
            - "600"

set_timeout_fallback_relay_matrix:
  name: Set timeout fallback relay matrix
  description: Write one of the valid relay matrices for the EMS timeout fallback.
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: kathrein_wallbox
    value:
      required: true
      selector:
        select:
          translation_key: ems_relay_matrix
          mode: dropdown
          options:
            - line_1
            - line_2
            - line_3
            - three_lines

set_timeout_fallback_current:
  name: Set timeout fallback current
  description: Write one of the valid fallback current values for the EMS timeout.
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: kathrein_wallbox
    value:
      required: true
      selector:
        select:
          translation_key: ems_timeout_fallback_current
          options:
            - "0"
            - "6"
            - "8"
            - "10"
            - "12"
            - "16"
            - "20"
            - "24"
            - "32"
