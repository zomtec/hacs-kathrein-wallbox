set_ems_control_enabled:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: kathrein_wallbox
    enabled:
      required: true
      selector:
        boolean: {}

set_relay_matrix:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: kathrein_wallbox
    value:
      required: true
      selector:
        select:
          translation_key: ems_relay_matrix
          mode: dropdown
          options:
            - phase_1
            - three_phases

set_charging_current:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: kathrein_wallbox
    value:
      required: true
      selector:
        number:
          min: 0
          max: 32
          step: 1
          unit_of_measurement: A
          mode: box

set_timeout_period:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: kathrein_wallbox
    value:
      required: true
      selector:
        select:
          translation_key: ems_timeout_period
          options:
            - "0"
            - "30"
            - "60"
            - "120"
            - "180"
            - "300"
            - "600"

set_timeout_fallback_relay_matrix:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: kathrein_wallbox
    value:
      required: true
      selector:
        select:
          translation_key: ems_relay_matrix
          mode: dropdown
          options:
            - phase_1
            - three_phases

set_timeout_fallback_current:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: kathrein_wallbox
    value:
      required: true
      selector:
        number:
          min: 0
          max: 32
          step: 1
          unit_of_measurement: A
          mode: box
