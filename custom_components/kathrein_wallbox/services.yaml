set_ems_control_enabled:
  name: Set EMS control state
  description: Enable or disable EMS control for this Wallbox.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: kathrein_wallbox
    enabled:
      required: true
      selector:
        boolean: {}

set_relay_matrix:
  name: Set relay matrix
  description: Choose the relay matrix for EMS control.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: kathrein_wallbox
    value:
      required: true
      selector:
        select:
          translation_key: ems_relay_matrix
          mode: dropdown
          options:
            - phase_1
            - three_phases

set_charging_current:
  name: Set charging current setpoint
  description: Set the charging current requested from the EMS.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: kathrein_wallbox
    value:
      required: true
      selector:
        number:
          min: 0
          max: 32
          step: 1
          unit_of_measurement: A
          mode: box

set_timeout_period:
  name: Set EMS timeout period
  description: Set how long the EMS override remains active.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: kathrein_wallbox
    value:
      required: true
      selector:
        select:
          translation_key: ems_timeout_period
          options:
            - "0"
            - "30"
            - "60"
            - "120"
            - "180"
            - "300"
            - "600"

set_timeout_fallback_relay_matrix:
  name: Set EMS timeout fallback relay matrix
  description: Choose the relay matrix used when the EMS timeout expires.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: kathrein_wallbox
    value:
      required: true
      selector:
        select:
          translation_key: ems_relay_matrix
          mode: dropdown
          options:
            - phase_1
            - three_phases

set_timeout_fallback_current:
  name: Set EMS timeout fallback current
  description: Set the fallback charging current used when the EMS timeout expires.
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: kathrein_wallbox
    value:
      required: true
      selector:
        number:
          min: 0
          max: 32
          step: 1
          unit_of_measurement: A
          mode: box
